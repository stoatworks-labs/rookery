[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/core",
    "crates/osc",
    "crates/fleet",
    "crates/discovery",
    "crates/instance-mock",
    "crates/instance-live",
    "crates/web",
    "crates/rookery",
]
default-members = [
    "crates/core",
    "crates/osc",
    "crates/fleet",
    "crates/discovery",
    "crates/instance-mock",
    "crates/instance-live",
    "crates/web",
    "crates/rookery",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/stoatworks-labs/rookery"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
if-addrs = "0.13"
mdns-sd = "0.11"
aes-gcm = "0.10"
rand = "0.10"
hex = "0.4"
jpeg-encoder = "0.6"
jpeg-decoder = "0.3"
